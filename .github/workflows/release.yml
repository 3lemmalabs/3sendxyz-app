name: Release Desktop Builds

on:
  push:
    branches:
      - main
      - codex/*

permissions:
  contents: write

jobs:
  version:
    name: Compute Version and Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_tag: ${{ steps.version.outputs.version_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Semantic Version
        id: version
        uses: PaulHatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "(feat|feature)"
          version_format: "${major}.${minor}.${patch}"

  build-macos:
    name: Build macOS Artifacts
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Validate macOS signing credentials
        shell: bash
        run: |
          if [[ -z "${CSC_LINK}" || -z "${CSC_KEY_PASSWORD}" ]]; then
            echo "Missing CSC_LINK/CSC_KEY_PASSWORD for macOS code signing."
            exit 1
          fi

          if [[ -n "${APPLE_API_KEY}" && -n "${APPLE_API_KEY_ID}" && -n "${APPLE_API_ISSUER}" ]]; then
            echo "Using App Store Connect API key notarization credentials."
            exit 0
          fi

          if [[ -n "${APPLE_ID}" && -n "${APPLE_APP_SPECIFIC_PASSWORD}" && -n "${APPLE_TEAM_ID}" ]]; then
            echo "Using Apple ID notarization credentials."
            exit 0
          fi

          echo "Missing Apple notarization credentials."
          echo "Set either APPLE_API_KEY + APPLE_API_KEY_ID + APPLE_API_ISSUER"
          echo "or APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID."
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Build and package macOS
        run: npm run dist:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          if-no-files-found: error
          path: |
            dist/3sendxyz-app-*.dmg
            dist/3sendxyz-app-*.zip
            dist/*.blockmap
            dist/latest*.yml

  build-windows:
    name: Build Windows Artifacts
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Validate Windows signing credentials
        shell: pwsh
        run: |
          $hasWinCert = -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)
          $hasSharedCert = -not [string]::IsNullOrWhiteSpace($env:CSC_LINK)

          if (-not $hasWinCert -and -not $hasSharedCert) {
            Write-Error "Missing Windows signing cert secret. Set WIN_CSC_LINK (or CSC_LINK)."
            exit 1
          }

          if ($hasWinCert -and [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            Write-Error "Missing WIN_CSC_KEY_PASSWORD."
            exit 1
          }

          if ($hasSharedCert -and [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            Write-Error "Missing CSC_KEY_PASSWORD."
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Build and package Windows
        run: npm run dist:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            dist/3sendxyz-app-*.exe
            dist/3sendxyz-app-*.zip
            dist/*.blockmap
            dist/latest*.yml

  publish-release:
    name: Publish GitHub Release
    needs:
      - version
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: release-assets

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**
          fail_on_unmatched_files: true
          generate_release_notes: true
          tag_name: ${{ needs.version.outputs.version_tag }}
          name: v${{ needs.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
